<!DOCTYPE html>
<html>
<head>
    <title>Open Elective Course Selection</title>
</head>
<body>

    <h2>Open Elective Course Selection</h2>

    <form>
        <label for="name">Student Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>

        <label for="roll">Roll Number:</label>
        <input type="text" id="roll" name="roll" required>
        <br><br>

        <label for="branch">Branch:</label>
        <select id="branch" name="branch">
            <option value="cse">CSE</option>
            <option value="ece">ECE</option>
            <option value="eee">EEE</option>
            <option value="mech">Mechanical</option>
            <option value="civil">Civil</option>
        </select>
        <br><br>

        <label>Choose Open Elective:</label>
        <br>

        <input type="radio" id="ai" name="elective" value="AI">
        <label for="ai">Artificial Intelligence</label>
        <br>

        <input type="radio" id="ml" name="elective" value="ML">
        <label for="ml">Machine Learning</label>
        <br>

        <input type="radio" id="cyber" name="elective" value="Cyber Security">
        <label for="cyber">Cyber Security</label>
        <br>

        <input type="radio" id="cloud" name="elective" value="Cloud Computing">
        <label for="cloud">Cloud Computing</label>
        <br><br>

        <label for="reason">Remarks:</label>
        <br>
        <textarea id="reason" name="reason" rows="4" cols="30"></textarea>
        <br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
