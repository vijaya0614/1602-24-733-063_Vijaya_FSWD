<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set-4 Q2 - Student Marks</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            display: flex;
            justify-content: center;
            padding: 40px 15px;
        }
        .container {
            width: 420px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #aaa;
            border-radius: 6px;
        }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 11px;
            border: none;
            border-radius: 6px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        #error {
            color: #dc2626;
            margin-top: 15px;
            font-weight: bold;
        }
        #result {
            margin-top: 15px;
            padding: 12px;
            background: #f0fdf4;
            border-radius: 8px;
            line-height: 1.8;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Student Marks Calculator</h2>

    <label>Subject 1</label>
    <input type="number" id="m1" min="0" max="100">

    <label>Subject 2</label>
    <input type="number" id="m2" min="0" max="100">

    <label>Subject 3</label>
    <input type="number" id="m3" min="0" max="100">

    <label>Subject 4</label>
    <input type="number" id="m4" min="0" max="100">

    <label>Subject 5</label>
    <input type="number" id="m5" min="0" max="100">

    <button onclick="calculateResult()">Calculate Result</button>

    <div id="error"></div>
    <div id="result"></div>
</div>

<script>
function calculateResult() {
    const marks = [
        Number(document.getElementById("m1").value),
        Number(document.getElementById("m2").value),
        Number(document.getElementById("m3").value),
        Number(document.getElementById("m4").value),
        Number(document.getElementById("m5").value)
    ];

    const error = document.getElementById("error");
    const result = document.getElementById("result");

    error.textContent = "";
    result.innerHTML = "";

    // Validate every mark
    for (let i = 0; i < marks.length; i++) {
        if (document.getElementById("m" + (i + 1)).value === "") {
            error.textContent = "Please enter marks for all five subjects.";
            return;
        }

        if (marks[i] < 0 || marks[i] > 100) {
            error.textContent = "Invalid input: each mark must be between 0 and 100.";
            return;
        }
    }

    const total = marks.reduce((sum, mark) => sum + mark, 0);
    const percentage = total / 5;

    let grade;
    if (percentage >= 90)
        grade = "A+";
    else if (percentage >= 80)
        grade = "A";
    else if (percentage >= 70)
        grade = "B";
    else if (percentage >= 60)
        grade = "C";
    else if (percentage >= 50)
        grade = "D";
    else
        grade = "F";

    // A student must score at least 40 in every subject to pass.
    const pass = marks.every(mark => mark >= 40);
    const resultText = pass ? "Pass" : "Fail";

    result.innerHTML = `
        <strong>Total:</strong> ${total} / 500<br>
        <strong>Percentage:</strong> ${percentage.toFixed(2)}%<br>
        <strong>Grade:</strong> ${grade}<br>
        <strong>Result:</strong> ${resultText}
    `;
}
</script>

</body>
</html>
